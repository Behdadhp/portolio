<!--
EUR/USD currency toggle for any money input.

Each toggle is a button marked .currency-toggle with:
  - data-target  : the id of the input it converts (required)
  - data-rate    : the EUR→USD rate at render time (required)
  - data-hint    : the id of an optional hint div to show in EUR mode

On form submit, every toggle in EUR mode multiplies its input by the rate
so the value posted to the server is always USD.
-->
<script>
(function() {
    var toggles = document.querySelectorAll(".currency-toggle");
    if (!toggles.length) return;

    function fmtRate(v) {
        return v.toLocaleString("en-US", { minimumFractionDigits: 4, maximumFractionDigits: 4 });
    }

    var formsToHandle = new Set();

    toggles.forEach(function(btn) {
        var inputId = btn.dataset.target || "id_price";
        var hintId = btn.dataset.hint || null;
        var rate = parseFloat(btn.dataset.rate);
        var input = document.getElementById(inputId);
        var hint = hintId ? document.getElementById(hintId) : null;

        if (!input || !rate || rate <= 0) {
            btn.style.display = "none";
            return;
        }

        btn.dataset.currency = "USD";

        btn.addEventListener("click", function() {
            if (btn.dataset.currency === "USD") {
                btn.dataset.currency = "EUR";
                btn.textContent = "EUR";
                btn.classList.remove("btn-outline-secondary");
                btn.classList.add("btn-outline-info");
                if (hint) {
                    hint.style.display = "block";
                    hint.textContent = "1 EUR = " + fmtRate(rate) + " USD — value will be auto-converted to USD on save";
                }
            } else {
                btn.dataset.currency = "USD";
                btn.textContent = "USD";
                btn.classList.remove("btn-outline-info");
                btn.classList.add("btn-outline-secondary");
                if (hint) hint.style.display = "none";
            }
        });

        var form = input.closest("form");
        if (form) formsToHandle.add(form);
    });

    /* One submit handler per form, converting any EUR-mode toggle inside it. */
    formsToHandle.forEach(function(form) {
        form.addEventListener("submit", function() {
            form.querySelectorAll(".currency-toggle").forEach(function(btn) {
                if (btn.dataset.currency !== "EUR") return;
                var input = document.getElementById(btn.dataset.target || "id_price");
                var rate = parseFloat(btn.dataset.rate);
                if (!input || !rate) return;
                var v = parseFloat(input.value);
                if (!isNaN(v) && v > 0) {
                    input.value = (v * rate).toFixed(2);
                }
            });
        });
    });
})();
</script>
